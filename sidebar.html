<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            z-index: 10000;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-shadow: -5px 0 25px rgba(79, 70, 229, 0.3);
            border-left: 1px solid rgba(139, 92, 246, 0.2);
        }
        
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(99, 102, 241, 0.2) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .sidebar-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #e0e7ff;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
            position: relative;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
            letter-spacing: 0.5px;
        }
        
        .sidebar-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            border-radius: 2px;
        }
        
        .question-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .question-item {
            padding: 15px;
            margin-bottom: 12px;
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            line-height: 1.4;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        
        .question-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }
        
        .question-item:hover {
            background: rgba(55, 48, 163, 0.7);
            border-color: rgba(139, 92, 246, 0.5);
            transform: translateX(-5px) translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }
        
        .question-item:hover::before {
            left: 100%;
        }
        
        .question-item.active {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.8), rgba(139, 92, 246, 0.8));
            border-color: rgba(167, 139, 250, 0.6);
            color: #ffffff;
            font-weight: 500;
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.5);
        }
        
        .question-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #a5b4fc;
        }
        
        .question-number {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 8px;
            flex-shrink: 0;
        }
        
        .question-label {
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .question-text {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            color: #e0e7ff;
            position: relative;
            z-index: 1;
            line-height: 1.5;
        }
        
        .question-item.active .question-text {
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        
        .empty-state {
            text-align: center;
            color: #a5b4fc;
            font-style: italic;
            padding: 30px 0;
            background: rgba(30, 27, 75, 0.4);
            border-radius: 10px;
            border: 1px dashed rgba(139, 92, 246, 0.3);
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(79, 70, 229, 0.3);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: #c7d2fe;
            padding: 5px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .close-btn:hover {
            background: rgba(220, 38, 38, 0.7);
            color: white;
            transform: rotate(90deg);
        }
        
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 5s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="stars" id="stars"></div>
        <button class="close-btn" title="关闭侧边栏">×</button>
        <div class="sidebar-header">✨ 问题导航</div>
        <ul class="question-list" id="questionList">
            <li class="empty-state">暂无问题，开始对话后这里会显示导航</li>
        </ul>
    </div>
    
    <script src="sidebar.js"></script>
</body>
</html>
